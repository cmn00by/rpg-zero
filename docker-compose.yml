services:
  app:
    build:
      context: .docker/php
    container_name: rpg_zero_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rpg_zero}
      DB_USERNAME: ${DB_USERNAME:-rpg_user}
      DB_PASSWORD: ${DB_PASSWORD:-rpg_pass}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      - db

  db:
    image: mariadb:11.4
    container_name: rpg_zero_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-rpg_zero}
      MYSQL_USER: ${DB_USERNAME:-rpg_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rpg_pass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  adminer:
    image: adminer:latest
    container_name: rpg_zero_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
